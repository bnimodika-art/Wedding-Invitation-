<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Invitation</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #fffaf5;
      color: #4a3a32;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .small {
      font-size: 18px;
      letter-spacing: 3px;
    }

    h1 {
      font-size: 42px;
      margin: 20px 0 10px;
    }

    .and {
      font-size: 25px;
      font-style: italic;
    }

    .date {
      font-size: 20px;
      margin-top: 25px;
      letter-spacing: 2px;
    }

    .message {
      max-width: 600px;
      line-height: 1.8;
      font-size: 17px;
      margin-top: 25px;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 13px 25px;
      border-radius: 30px;
      background: #6b5145;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="small">TOGETHER WITH THEIR FAMILIES</div>

    <h1>Ashan</h1>

    <div class="and">&</div>

    <h1>Sathsarani</h1>

    <div class="date">
      20 DECEMBER 2026
    </div>

    <div class="message">
      With joyful hearts, we invite you to celebrate
      our special day and share the beginning of
      our beautiful journey together.
    </div>

    <a class="button" href="#">
      VIEW WEDDING DETAILS
    </a>

  </section>

</body>
</html>
